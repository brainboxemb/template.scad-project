name: PR cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    uses: brainboxemb/tool.scad-project/.github/workflows/project-pr-cleanup.yml@1bce811ab425c9c69b32e794ab323c740e895ae3
    with:
      pr_number: ${{ github.event.pull_request.number }}
      pr_branch_prefix: dev/pr
      delete_source_branch: true
