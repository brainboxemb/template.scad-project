name: Prepare tool.scad-project v0.14.8 repin

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'feature/pr-46-tool-v0148-release-qualification'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repin branch
        uses: actions/checkout@v4
        with:
          ref: feature/pr-46-tool-v0148-release-qualification
          submodules: false
          fetch-depth: 0

      - name: Repin released SCAD tool
        shell: bash
        run: |
          set -euo pipefail
          old_ref='v0.14.7'
          new_ref='v0.14.8'
          old_sha='3935e5f86fe309b8908a05554f7ada336a6d6886'
          new_sha='85781a6b21a0f6a06d37be154fd9eb475ecaa2a4'

          git submodule update --init --depth 1 -- tools/tool.scad-project
          git -C tools/tool.scad-project fetch --no-tags --depth 1 origin "$new_sha"
          git -C tools/tool.scad-project checkout --detach "$new_sha"
          test "$(git -C tools/tool.scad-project rev-parse HEAD)" = "$new_sha"

          python3 - <<'PY'
          from pathlib import Path

          old_ref = 'v0.14.7'
          new_ref = 'v0.14.8'
          old_sha = '3935e5f86fe309b8908a05554f7ada336a6d6886'
          new_sha = '85781a6b21a0f6a06d37be154fd9eb475ecaa2a4'

          files = [
              Path('project.yml'),
              Path('scripts/run-verification.sh'),
              Path('AGENTS.md'),
              Path('README.md'),
              Path('docs/ci-orchestration.md'),
              Path('CHANGELOG.md'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              text = text.replace(old_ref, new_ref).replace(old_sha, new_sha)
              path.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '- Align repository verification and maintainer guidance with the semantic workflow-ref plus exact-gitlink dependency contract.\n'
          addition = '- Qualify semantic cross-repository Release calls through lightweight `tool.scad-project` release tags, fixing the annotated-tag workflow-resolution blocker exposed by the first v0.0.5 release attempt.\n'
          if addition not in text:
              if text.count(marker) != 1:
                  raise SystemExit('CHANGELOG v0.0.5 insertion marker is not unique')
              text = text.replace(marker, marker + addition, 1)
              changelog.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Commit non-workflow repin
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project.yml scripts/run-verification.sh AGENTS.md README.md docs/ci-orchestration.md CHANGELOG.md tools/tool.scad-project
          git diff --cached --check
          git commit -m 'Repin reference consumer to tool.scad-project v0.14.8'
          git push origin HEAD:feature/pr-46-tool-v0148-release-qualification
