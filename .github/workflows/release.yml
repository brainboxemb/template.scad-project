name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable release version, e.g. v0.0.1"
        required: true
        type: string
      source_sha:
        description: "Exact 40-character source commit SHA from main"
        required: true
        type: string
  push:
    branches:
      - "release-request/**"

permissions:
  actions: read
  contents: write
  packages: read

jobs:
  release:
    uses: brainboxemb/tool.scad-project/.github/workflows/project-release.yml@v0.14.7
    with:
      version: ${{ github.event.inputs.version || '' }}
      source_sha: ${{ github.event.inputs.source_sha || '' }}
      build_path: bld
      verification_path: vrf/out
