name: SCAD production

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  scad:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/brainboxemb/scad-toolchain:v0.4.1

    env:
      SCAD_TOOLCHAIN_IMAGE: ghcr.io/brainboxemb/scad-toolchain:v0.4.1
      SCAD_TOOLCHAIN_VERSION: v0.4.1
      SCAD_PROJECT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      SCAD_PROJECT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact consumer revision with Moon VCS history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Configure Git safe directories
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/tools/tool.git-project"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/tools/tool.scad-project"

      - name: Bootstrap released tooling
        shell: bash
        run: |
          set -euo pipefail
          bash ./bootstrap.sh
          test "$(git -C tools/tool.git-project rev-parse HEAD)" = "fcfe97fd468d2c5f03e0c11637a62db8fafc1751"
          SCAD_TOOL_SHA="$(git -C tools/tool.scad-project rev-parse HEAD)"
          test "$SCAD_TOOL_SHA" = "68301267273ea21c4b82ff3b26e1c8a30ff7b065"
          echo "SCAD_PROJECT_TOOL_SHA=$SCAD_TOOL_SHA" >> "$GITHUB_ENV"
          grep -F 'ref: v0.12.0' project.yml
          tools/tool.git-project/git-project.sh validate --repo .

      - name: Restore normal SCons object cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/scad-project/scons
          key: template-scad-build-scons-v1-${{ runner.os }}-${{ github.repository_id }}-v0.4.1-68301267273ea21c4b82ff3b26e1c8a30ff7b065-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            template-scad-build-scons-v1-${{ runner.os }}-${{ github.repository_id }}-v0.4.1-68301267273ea21c4b82ff3b26e1c8a30ff7b065-

      - name: Restore verification SCons object cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/scad-project/verification-scons
          key: template-scad-verification-scons-v1-${{ runner.os }}-${{ github.repository_id }}-v0.4.1-68301267273ea21c4b82ff3b26e1c8a30ff7b065-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            template-scad-verification-scons-v1-${{ runner.os }}-${{ github.repository_id }}-v0.4.1-68301267273ea21c4b82ff3b26e1c8a30ff7b065-

      - name: Run or hydrate SCAD production graph
        uses: brainboxemb/tool.git-project/moon@v0.2.3
        with:
          task: consumer:scad.ci
          cache-namespace: template-scad-production-t6-v1

      - name: Verify producer output and current materialization evidence
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          for file in \
            bld/png/tube-holder-assembly.png \
            bld/stl/tube-holder-assembly.stl \
            bld/design/README.md \
            bld/README.md \
            bld/png/README.md \
            bld/publication-info.txt \
            bld/evidence/executions/scad-docs/execution.json \
            bld/evidence/executions/scad-docs/execution.log \
            bld/evidence/domain/last-design-build.json \
            bld/evidence/executions/scad-build/execution.json \
            bld/evidence/executions/scad-build/execution.log \
            bld/evidence/domain/last-build.json \
            vrf/out/png/tube-holder-bore-check.png \
            vrf/out/png/mounting-plate-thickness-check.png \
            vrf/out/README.md \
            vrf/out/publication-info.txt \
            vrf/out/evidence/executions/scad-verify/execution.json \
            vrf/out/evidence/executions/scad-verify/execution.log \
            vrf/out/evidence/domain/last-verification-build.json \
            .cache/scad-project/state/last-build.json \
            .cache/scad-project/state/last-design-build.json \
            .cache/scad-project/verification-state/last-verification-build.json \
            .moon/invocations/consumer_scad.ci/materialization.json \
            .moon/invocations/consumer_scad.ci/moon.log; do
            test -s "$file"
          done

          for readme in bld/README.md vrf/out/README.md; do
            grep -F '## Producer execution evidence' "$readme"
            grep -F '## Domain evidence' "$readme"
            grep -F '## Orchestration/materialization evidence' "$readme"
            grep -F '## Publication context' "$readme"
          done

          SOURCE_REVISION="$SOURCE_REVISION" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          owner_revision = "68301267273ea21c4b82ff3b26e1c8a30ff7b065"
          expected_executions = {
              Path("bld/evidence/executions/scad-docs/execution.json"): (
                  "scad.docs", "design-build", "../../domain/last-design-build.json"
              ),
              Path("bld/evidence/executions/scad-build/execution.json"): (
                  "scad.build", "build", "../../domain/last-build.json"
              ),
              Path("vrf/out/evidence/executions/scad-verify/execution.json"): (
                  "scad.verify", "verify", "../../domain/last-verification-build.json"
              ),
          }

          producer_revisions = {}
          for path, (capability, action, domain_report) in expected_executions.items():
              data = json.loads(path.read_text(encoding="utf-8"))
              checks = {
                  "schema": "brainboxemb.execution-evidence",
                  "schema_version": 1,
                  "capability": capability,
                  "owner": "brainboxemb/tool.scad-project",
                  "action": action,
                  "owner_revision": owner_revision,
                  "status": "success",
                  "exit_code": 0,
                  "log": "execution.log",
                  "tool_scad_project_version": "0.12.0",
              }
              for key, expected in checks.items():
                  if data.get(key) != expected:
                      raise SystemExit(f"{path}: {key} mismatch: {data.get(key)!r} != {expected!r}")
              source_revision = data.get("source_revision", "")
              if not re.fullmatch(r"[0-9a-fA-F]{40}", source_revision):
                  raise SystemExit(f"{path}: invalid producer source_revision")
              if data.get("domain_evidence") != [domain_report]:
                  raise SystemExit(f"{path}: domain_evidence mismatch")
              if not (path.parent / data["log"]).is_file():
                  raise SystemExit(f"{path}: referenced execution log missing")
              producer_revisions[capability] = source_revision

          expected_materialization = os.environ["SOURCE_REVISION"]
          materialization_path = Path(".moon/invocations/consumer_scad.ci/materialization.json")
          materialization = json.loads(materialization_path.read_text(encoding="utf-8"))
          if materialization.get("task") != "consumer:scad.ci":
              raise SystemExit("materialization task mismatch")
          if materialization.get("source_revision") != expected_materialization:
              raise SystemExit("materialization revision mismatch")
          if materialization.get("status") != "success" or materialization.get("exit_code") != 0:
              raise SystemExit("materialization did not succeed")

          print("Producer revisions:")
          for capability, revision in sorted(producer_revisions.items()):
              print(f"  {capability}: {revision}")
          print(f"Current materialization revision: {expected_materialization}")
          PY

      - name: Stage build output with current orchestration evidence
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/template-scad-build-publication"
          rm -rf "$staging"
          mkdir -p "$staging/orchestration"
          cp -a bld/. "$staging/"
          cp .moon/invocations/consumer_scad.ci/moon.log "$staging/orchestration/moon.log"
          cp .moon/invocations/consumer_scad.ci/materialization.json "$staging/orchestration/materialization.json"

      - name: Stage verification output with current orchestration evidence
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/template-scad-verification-publication"
          rm -rf "$staging"
          mkdir -p "$staging/orchestration"
          cp -a vrf/out/. "$staging/"
          cp .moon/invocations/consumer_scad.ci/moon.log "$staging/orchestration/moon.log"
          cp .moon/invocations/consumer_scad.ci/materialization.json "$staging/orchestration/materialization.json"

      - name: Upload prepared build publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: template-scad-project-build-publication
          path: ${{ runner.temp }}/template-scad-build-publication
          if-no-files-found: error
          retention-days: 14

      - name: Upload prepared verification publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: template-scad-project-verification-publication
          path: ${{ runner.temp }}/template-scad-verification-publication
          if-no-files-found: error
          retention-days: 14

  publish-build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: scad
    permissions:
      contents: write
    uses: brainboxemb/tool.git-project/.github/workflows/reusable-generated-output-publish.yml@v0.2.3
    with:
      artifact_name: template-scad-project-build-publication
      branch_suffix: build

  publish-verification:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: scad
    permissions:
      contents: write
    uses: brainboxemb/tool.git-project/.github/workflows/reusable-generated-output-publish.yml@v0.2.3
    with:
      artifact_name: template-scad-project-verification-publication
      branch_suffix: verification
