name: SCAD production

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  scad:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/brainboxemb/scad-toolchain:v0.4.1

    env:
      SCAD_TOOLCHAIN_IMAGE: ghcr.io/brainboxemb/scad-toolchain:v0.4.1
      SCAD_TOOLCHAIN_VERSION: v0.4.1
      SCAD_PROJECT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}

    steps:
      - name: Checkout exact consumer revision with Moon VCS history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Bootstrap released tooling
        shell: bash
        run: |
          set -euo pipefail
          bash ./bootstrap.sh
          test "$(git -C tools/tool.git-project rev-parse HEAD)" = "d6d760845967f70bd266b3ac2b36c9d5b0edc862"
          test "$(git -C tools/tool.scad-project rev-parse HEAD)" = "47bf0924e306dac371a46adfdc577623949f1579"
          grep -F 'ref: v0.10.1' project.yml
          tools/tool.git-project/git-project.sh validate --repo .

      - name: Restore normal SCons object cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/scad-project/scons
          key: template-scad-build-scons-v1-${{ runner.os }}-${{ github.repository_id }}-v0.4.1-47bf0924e306dac371a46adfdc577623949f1579-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            template-scad-build-scons-v1-${{ runner.os }}-${{ github.repository_id }}-v0.4.1-47bf0924e306dac371a46adfdc577623949f1579-

      - name: Restore verification SCons object cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/scad-project/verification-scons
          key: template-scad-verification-scons-v1-${{ runner.os }}-${{ github.repository_id }}-v0.4.1-47bf0924e306dac371a46adfdc577623949f1579-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            template-scad-verification-scons-v1-${{ runner.os }}-${{ github.repository_id }}-v0.4.1-47bf0924e306dac371a46adfdc577623949f1579-

      - name: Run or hydrate normal SCAD producer
        uses: brainboxemb/tool.git-project/moon@v0.2.2
        with:
          task: consumer:scad.build
          cache-namespace: template-scad-production

      - name: Run or hydrate verification producer
        shell: bash
        env:
          MOON_INSTALL_ROOT: ${{ runner.temp }}/tool-git-project/moon-runtime
        run: |
          set -euo pipefail
          bash tools/tool.git-project/moon-project.sh run consumer:scad.verify --repo .

      - name: Verify producer output and current materialization evidence
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          for file in \
            bld/png/tube-holder-assembly.png \
            bld/stl/tube-holder-assembly.stl \
            bld/README.md \
            bld/publication-info.txt \
            vrf/out/png/tube-holder-bore-check.png \
            vrf/out/png/mounting-plate-thickness-check.png \
            vrf/out/README.md \
            vrf/out/publication-info.txt \
            .cache/scad-project/state/last-build.json \
            .cache/scad-project/state/last-design-build.json \
            .cache/scad-project/verification-state/last-verification-build.json \
            .moon/invocations/consumer_scad.build/materialization.json \
            .moon/invocations/consumer_scad.build/moon.log \
            .moon/invocations/consumer_scad.verify/materialization.json \
            .moon/invocations/consumer_scad.verify/moon.log; do
            test -s "$file"
          done

          SOURCE_REVISION="$SOURCE_REVISION" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ["SOURCE_REVISION"]
          for task in ("consumer_scad.build", "consumer_scad.verify"):
              path = Path(".moon/invocations") / task / "materialization.json"
              data = json.loads(path.read_text(encoding="utf-8"))
              if data.get("source_revision") != expected:
                  raise SystemExit(f"{task}: materialization revision mismatch")
              if data.get("status") != "success" or data.get("exit_code") != 0:
                  raise SystemExit(f"{task}: materialization did not succeed")
          PY

      - name: Stage build producer output with current materialization evidence
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/template-scad-build-publication"
          rm -rf "$staging"
          mkdir -p "$staging/evidence/domain" "$staging/orchestration"
          cp -a bld/. "$staging/"
          cp .cache/scad-project/state/last-build.json "$staging/evidence/domain/last-build.json"
          cp .cache/scad-project/state/last-design-build.json "$staging/evidence/domain/last-design-build.json"
          cp .moon/invocations/consumer_scad.build/moon.log "$staging/orchestration/moon.log"
          cp .moon/invocations/consumer_scad.build/materialization.json "$staging/orchestration/materialization.json"

      - name: Stage verification producer output with current materialization evidence
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/template-scad-verification-publication"
          rm -rf "$staging"
          mkdir -p "$staging/evidence/domain" "$staging/orchestration"
          cp -a vrf/out/. "$staging/"
          cp .cache/scad-project/verification-state/last-verification-build.json "$staging/evidence/domain/last-verification-build.json"
          cp .moon/invocations/consumer_scad.verify/moon.log "$staging/orchestration/moon.log"
          cp .moon/invocations/consumer_scad.verify/materialization.json "$staging/orchestration/materialization.json"

      - name: Upload prepared build publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: template-scad-project-build-publication
          path: ${{ runner.temp }}/template-scad-build-publication
          if-no-files-found: error
          retention-days: 14

      - name: Upload prepared verification publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: template-scad-project-verification-publication
          path: ${{ runner.temp }}/template-scad-verification-publication
          if-no-files-found: error
          retention-days: 14

  publish-build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: scad
    permissions:
      contents: write
    uses: brainboxemb/tool.git-project/.github/workflows/reusable-generated-output-publish.yml@v0.2.2
    with:
      artifact_name: template-scad-project-build-publication
      branch_suffix: build

  publish-verification:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: scad
    permissions:
      contents: write
    uses: brainboxemb/tool.git-project/.github/workflows/reusable-generated-output-publish.yml@v0.2.2
    with:
      artifact_name: template-scad-project-verification-publication
      branch_suffix: verification
