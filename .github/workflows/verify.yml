name: Verify SCAD project

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/brainboxemb/scad-toolchain:v0.3.0

    steps:
      - name: Checkout project and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain
        run: scad-toolchain-info

      - name: Show project-tool version
        run: |
          bash ./tools/tool.scad-project/scad-project.sh --help

      - name: Check external dependencies
        run: |
          bash ./tools/tool.scad-project/scad-project.sh externals-check

      - name: Lint project configuration
        run: |
          bash ./tools/tool.scad-project/scad-project.sh config-lint

      - name: Lint OpenSCAD source documentation
        run: |
          bash ./tools/tool.scad-project/scad-project.sh docs-lint

      - name: Lint design documentation
        run: |
          bash ./tools/tool.scad-project/scad-project.sh design-lint

      - name: Render design documentation
        run: |
          bash ./tools/tool.scad-project/scad-project.sh design-render

      - name: Verify project
        run: |
          bash ./tools/tool.scad-project/scad-project.sh verify

      - name: Upload generated output
        uses: actions/upload-artifact@v4
        with:
          name: scad-project-${{ github.sha }}
          path: |
            bld
            dsg/openscad/**/design/img/*.png
