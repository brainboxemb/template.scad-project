name: Verify SCAD project

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/brainboxemb/scad-toolchain:v0.2.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show toolchain
        run: scad-toolchain-info

      - name: Render design images
        shell: bash
        run: bash scripts/render-design-images.sh

      - name: Verify build
        shell: bash
        run: bash scripts/verify.sh

      - name: Build verification site
        shell: bash
        run: bash scripts/build-verification-site.sh

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: bld/verification-site

      - name: Publish verification snapshot
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global credential.helper store
          printf "https://x-access-token:%s@github.com\n" "$GITHUB_TOKEN" > ~/.git-credentials
          bash scripts/publish-verification.sh
