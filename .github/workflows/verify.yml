name: Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  packages: read

jobs:
  verify:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: brainboxemb/tool.scad-project/.github/workflows/project-verify.yml@19f38a6cf283e281ca7b9ab6ef8397740afe6fbf
    with:
      artifact_name: template-scad-project-verification
      verification_path: vrf/out
