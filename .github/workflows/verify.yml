name: Verify

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
      - "!release-request/**"
  pull_request:

permissions:
  contents: write
  packages: read

jobs:
  verify:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: brainboxemb/tool.scad-project/.github/workflows/project-verify.yml@v0.9.7
    with:
      artifact_name: template-scad-project-verification
      verification_path: vrf/out
