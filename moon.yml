tasks:
  scad.docs:
    inputs:
      - 'dsg/openscad/**/*.scad'
      - 'dsg/openscad/**/design/**'
      - 'dsg/openscad/ext/lib.scad.clamps'
      - 'dsg/pythonscad/**/*.py'
      - 'dsg/pythonscad/**/design/**'

  scad.build:
    inputs:
      - 'dsg/openscad/**/*.scad'
      - 'dsg/openscad/**/render.yml'
      - 'dsg/openscad/**/export.yml'
      - 'dsg/openscad/ext/lib.scad.clamps'

  scad.verify:
    inputs:
      - 'dsg/openscad/components/tube-holder/tube_holder.scad'
      - 'dsg/openscad/components/mounting-plate/mounting_plate.scad'
      - 'dsg/openscad/ext/lib.scad.clamps'
      - 'vrf/README.md'
      - 'vrf/openscad/**'
      - 'vrf/templates/**'
      - 'scripts/**'
      - 'bootstrap.sh'
      - 'bootstrap.ps1'
      - 'update-repo.sh'
      - 'update-repo.ps1'
      - '.github/workflows/**'
      - 'tools/tool.git-project'
