workspace:
  inheritedTasks:
    include:
      - scad.docs
      - scad.build
      - scad.verify

tasks:
  scad.docs:
    inputs:
      - 'dsg/openscad/**/*.scad'
      - 'dsg/openscad/**/design/**'
      - 'dsg/openscad/ext/**'
      - 'dsg/pythonscad/**/*.py'
      - 'dsg/pythonscad/**/design/**'

  scad.build:
    inputs:
      - 'dsg/openscad/**/*.scad'
      - 'dsg/openscad/**/render.yml'
      - 'dsg/openscad/**/export.yml'
      - 'dsg/openscad/ext/**'

  scad.verify:
    inputs:
      - 'doc/50-00-verification.md'
      - 'dsg/openscad/components/**'
      - 'dsg/openscad/ext/**'
      - 'vrf/**'
      - 'scripts/**'
      - 'bootstrap.sh'
      - 'bootstrap.ps1'
      - 'update.sh'
      - 'update.ps1'
      - '.github/workflows/**'
      - 'tools/tool.git-project'
