project:
  name: template.scad-project

tooling:
  tool_scad_project:
    type: git-submodule
    url: https://github.com/brainboxemb/tool.scad-project.git
    path: tools/tool.scad-project
    ref: v0.5.0

paths:
  design_root: dsg
  build_root: bld

openscad:
  common_flags:
    - --enable=object-function
  render_flags:
    - --render
  image_size: [1600, 1000]
  design_image_size: [640, 480]

pythonscad:
  common_flags:
    - --trust-python
  render_flags:
    - --render

externals:
  - name: lib.scad.clamps
    type: git-submodule
    url: https://github.com/brainboxemb/lib.scad.clamps.git
    path: dsg/openscad/ext/lib.scad.clamps
    ref: main
    required_file: openscad/tube-clamp/tube_clamp.scad

builds:
  - name: tube-holder-assembly-png
    source: dsg/openscad/render/tube-holder-assembly.scad
    output: bld/png/tube-holder-assembly.png

  - name: tube-holder-assembly-stl
    source: dsg/openscad/render/tube-holder-assembly.scad
    output: bld/stl/tube-holder-assembly.stl

publication:
  production:
    source_branch: main
    build_branch: build
    verification_branch: verification

  development:
    build_branch: dev/build
    verification_branch: dev/verification

  tags:
    pattern: "v*"
